apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: shellsessions.lens.io
  labels:
    {{- include "linse.labels" . | nindent 4 }}
spec:
  group: lens.io
  names:
    kind: ShellSession
    listKind: ShellSessionList
    plural: shellsessions
    singular: shellsession
    shortNames:
      - ss
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Username
          type: string
          jsonPath: .spec.username
        - name: Pod
          type: string
          jsonPath: .status.podName
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - username
              properties:
                username:
                  type: string
                  description: Operator username. Must match the CR name.
                idleTimeoutMinutes:
                  type: integer
                  minimum: 1
                  description: Minutes of inactivity before the session is deleted. Defaults to 30.
                kubeconfigSecret:
                  type: string
                  description: Name of the Secret in lens-shells that holds the merged kubeconfig.
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                phase:
                  type: string
                  description: "One of: Pending, Progressing, Creating, Running, Failed, Terminating."
                podName:
                  type: string
                podIP:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
