apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: linse
  labels:
    {{- include "linse.labels" . | nindent 4 }}
rules:
  # 1. Impersonation - all user-facing K8s calls carry the real LDAP identity
  - apiGroups: [""]
    resources: ["users", "groups"]
    verbs: ["impersonate"]

  # 2. SubjectAccessReview - RBAC checks via SAR (SA's own identity)
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]

  # 3. Identity auto-provisioning - ClusterRoleBindings per LDAP user on login
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    verbs: ["get", "create", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["bind"]

  # 4. Permission Manager - SA + Role + RoleBinding + Secret per user/namespace
  - apiGroups: [""]
    resources: ["serviceaccounts", "namespaces"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles"]
    verbs: ["bind"]

  # 5. Workload, infrastructure & cache informers
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "persistentvolumeclaims", "events", "endpoints", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]

  # 6. CRD discovery - CRD explorer UI and API resource enumeration
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]

  # 7. Argo CD application pollers
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "applicationsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: linse
  labels:
    {{- include "linse.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: linse
subjects:
  - kind: ServiceAccount
    name: linse
    namespace: {{ .Release.Namespace }}
---
# Cloud Shell - ShellSession CRD access (cluster-scoped)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: linse-cloudshell
  labels:
    {{- include "linse.labels" . | nindent 4 }}
rules:
  - apiGroups: ["lens.io"]
    resources: ["shellsessions"]
    verbs: ["get", "list", "create", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: linse-cloudshell
  labels:
    {{- include "linse.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: linse-cloudshell
subjects:
  - kind: ServiceAccount
    name: linse
    namespace: {{ .Release.Namespace }}
---
# Cloud Shell - Secret access scoped to lens-shells namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: linse-cloudshell-secrets
  namespace: lens-shells
  labels:
    {{- include "linse.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: linse-cloudshell-secrets
  namespace: lens-shells
  labels:
    {{- include "linse.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: linse-cloudshell-secrets
subjects:
  - kind: ServiceAccount
    name: linse
    namespace: {{ .Release.Namespace }}
