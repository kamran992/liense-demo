services:
  gitlab:
    image: ${GITLAB_IMAGE:-gitlab/gitlab-ce:19.0.0-ce.0}
    container_name: linse-gitlab
    restart: unless-stopped
    hostname: gitlab.local
    environment:
      GITLAB_ROOT_PASSWORD: ${GITLAB_ROOT_PASSWORD:-Demo1234!}
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://gitlab.local:8929'
        gitlab_rails['gitlab_shell_ssh_port'] = 2424
        # Disable features not needed for demo
        prometheus_monitoring['enable'] = false
        alertmanager['enable'] = false
    ports:
      - "8929:8929"   # HTTP - app inside k3d connects here via hostAlias
      - "2424:22"     # SSH (optional)
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab
    shm_size: "256m"
    # GitLab needs ~4GB RAM and 5-10 min to fully start.
    # Check readiness: docker logs -f linse-gitlab | grep "gitlab Reconfigured"

volumes:
  gitlab-config:
  gitlab-logs:
  gitlab-data:

networks:
  default:
    name: ${K3D_NETWORK:-k3d-linse-demo}
    external: true
