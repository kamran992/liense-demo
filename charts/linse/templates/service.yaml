apiVersion: v1
kind: Service
metadata:
  name: linse
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "linse.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: app
    {{- include "linse.selectorLabels" . | nindent 4 }}
